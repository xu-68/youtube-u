name: Build unsigned uYouPlus

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unsigned-uyouplus
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - uses: actions/checkout@v4
        with:
          path: main
          submodules: recursive
          persist-credentials: false

      - name: Apply plugin compatibility fixes
        run: sh main/scripts/apply-compat-patches.sh

      - name: Install build dependencies
        run: |
          brew install ldid dpkg make
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Checkout Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: theos
          submodules: recursive
          persist-credentials: false

      - name: Checkout Theos Jailed
        uses: actions/checkout@v4
        with:
          repository: qnblackcat/theos-jailed
          path: theos-jailed
          submodules: recursive
          persist-credentials: false

      - name: Install SDK and Theos Jailed
        run: |
          git clone --depth=1 --filter=blob:none --sparse https://github.com/theos/sdks.git sdk-download
          git -C sdk-download sparse-checkout set iPhoneOS16.5.sdk
          test -d sdk-download/iPhoneOS16.5.sdk
          mkdir -p "$THEOS/sdks" "$THEOS/lib/iphone/rootless"
          cp -R sdk-download/iPhoneOS16.5.sdk "$THEOS/sdks/"
          ./theos-jailed/install

      - name: Download privately stored input IPA
        env:
          GH_TOKEN: ${{ secrets.INPUT_TOKEN }}
          INPUT_REPO: ${{ secrets.INPUT_REPO }}
        run: |
          test -n "$GH_TOKEN" || { echo 'Configure INPUT_TOKEN for the private input repository'; exit 1; }
          test -n "$INPUT_REPO" || { echo 'Configure INPUT_REPO'; exit 1; }
          mkdir -p "$RUNNER_TEMP/ipa-input"
          gh release download youtube-input --repo "$INPUT_REPO" --pattern youtube.ipa --dir "$RUNNER_TEMP/ipa-input"
          python3 main/scripts/inspect_ipa.py "$RUNNER_TEMP/ipa-input/youtube.ipa" --input
          unzip -q "$RUNNER_TEMP/ipa-input/youtube.ipa" -d main

      - name: Compile and inject
        working-directory: main
        run: |
          set -o pipefail
          make package THEOS_PACKAGE_SCHEME=rootless IPA=Payload/YouTube.app FINALPACKAGE=1 YOUTUBE_VERSION=21.43.5 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Verify output
        working-directory: main
        run: |
          shopt -s nullglob
          ipas=(packages/*.ipa)
          test "${#ipas[@]}" -eq 1
          python3 scripts/inspect_ipa.py "${ipas[0]}" --output
          shasum -a 256 "${ipas[0]}" > packages/SHA256SUMS.txt

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: uYouPlus-21.43.5-unsigned
          path: |
            main/packages/*.ipa
            main/packages/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 3

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ runner.temp }}/build.log
          if-no-files-found: ignore
          retention-days: 3
